name: NetSentinel CI
run-name: NetSentinel CI - ${{ github.ref_name }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train model
        run: |
          mkdir -p models
          python train_model.py

      - name: Verify application startup
        run: python -c "from app import create_app; app = create_app(); print('Application startup: OK')"

      - name: Lint
        run: python -m flake8 app config.py run.py train_model.py tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        run: python -m pytest -q
